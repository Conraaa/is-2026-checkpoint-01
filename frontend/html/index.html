<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>TeamBoard - Grupo UTN</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        table { margin: auto; border-collapse: collapse; width: 80%; }
        th, td { border: 1px solid #aaa; padding: 10px; }
        th { background: #007bff; color: white; }
        .online { color: green; font-weight: bold; }
        .offline { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>TeamBoard App</h1>
    <p>Estado del Backend: <span id="status">Verificando...</span></p>
    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Legajo</th>
                <th>Feature</th>
                <th>Servicio</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tabla-equipo"></tbody>
    </table>
    <script src="app.js"></script>
</body>
</html>
